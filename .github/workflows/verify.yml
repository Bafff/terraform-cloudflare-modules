name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, resolved from its official repository tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked tools
        run: |
          scripts/setup-ci-tools.sh --install-dir "$RUNNER_TEMP/public-module-tools"
          echo "$RUNNER_TEMP/public-module-tools" >> "$GITHUB_PATH"
      - name: Verify repository
        run: make check
